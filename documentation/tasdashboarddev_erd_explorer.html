<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>TasDashBoardDev — Interactive Relational ERD Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-canvas: #070b14;
      --bg-panel: rgba(15, 23, 42, 0.85);
      --bg-card: rgba(30, 41, 59, 0.7);
      --border-color: rgba(148, 163, 184, 0.15);
      --border-glow: rgba(56, 189, 248, 0.4);
      --accent-blue: #38bdf8;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --accent-purple: #c084fc;
      --accent-emerald: #10b981;
      --accent-cyan: #06b6d4;
      --accent-indigo: #818cf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --scrollbar-thumb: rgba(100, 116, 139, 0.45);
      --scrollbar-track: rgba(15, 23, 42, 0.5);
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
      scrollbar-width: thin;
    }

    @supports not (scrollbar-color: auto) {
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-canvas);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    header {
      background: rgba(11, 18, 33, 0.95);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      z-index: 50;
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-badge {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: white;
      font-weight: 800;
      font-size: 11.5px;
      padding: 4px 9px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Filter & Search Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .search-box input {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 7px 28px 7px 32px;
      font-size: 12.5px;
      font-family: inherit;
      width: 215px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, width 0.2s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
      width: 255px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      color: var(--text-dim);
      font-size: 13px;
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      display: none;
      padding: 2px 4px;
      line-height: 1;
    }

    .search-clear:hover {
      color: var(--text-main);
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 340px;
      max-height: 360px;
      overflow-y: auto;
      background: rgba(11, 18, 33, 0.98);
      border: 1px solid var(--border-glow);
      border-radius: 10px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.75);
      z-index: 100;
      display: none;
      padding: 6px;
    }

    .search-dropdown.open {
      display: block;
    }

    .search-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: rgba(56, 189, 248, 0.14);
    }

    .domain-filters {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      min-width: 0;
      padding: 2px 0;
    }

    .domain-filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .filter-btn:hover, .filter-btn.active {
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .action-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .action-btn:hover {
      filter: brightness(1.12);
    }

    .action-btn.secondary {
      background: rgba(30, 41, 59, 0.85);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .action-btn.secondary.active {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.14);
    }

    /* Main Workspace Layout */
    .workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Diagram Canvas Container */
    .canvas-container {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      background: radial-gradient(circle at center, #0b1222 0%, #070b14 100%);
    }

    .canvas-container.dragging {
      cursor: grabbing;
    }

    #svgWrapper {
      width: 4626px;
      height: 2460px;
      transform-origin: 0 0;
      will-change: transform;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Floating Zoom Controls */
    .zoom-hud {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      border-radius: 10px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      z-index: 40;
    }

    .hud-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .hud-btn:hover {
      background: var(--accent-blue);
      color: #040711;
      border-color: var(--accent-blue);
    }

    .zoom-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 2px 0;
    }

    /* Side Drawer / Inspector */
    .inspector-panel {
      width: 440px;
      min-width: 440px;
      background: rgba(11, 18, 33, 0.98);
      border-left: 1px solid var(--border-color);
      backdrop-filter: blur(20px);
      height: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.6);
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1), min-width 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
      z-index: 45;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .inspector-panel.collapsed {
      width: 0;
      min-width: 0;
      border-left-width: 0;
      opacity: 0;
      pointer-events: none;
    }

    .inspector-header {
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .inspector-title {
      font-size: 15.5px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent-blue);
      word-break: break-all;
    }

    .close-btn {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .close-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-rose);
      background: rgba(244, 63, 94, 0.18);
    }

    .inspector-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stat-badge-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat-badge {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .stat-val {
      font-size: 17px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .rel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rel-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: left;
      width: 100%;
      color: inherit;
      font-family: inherit;
    }

    .rel-card:hover {
      border-color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.12);
      transform: translateX(2px);
    }

    .code-box {
      background: #040711;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #7dd3fc;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
    }

    .mini-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent-blue);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .mini-btn:hover {
      background: var(--accent-blue);
      color: #040711;
    }

    /* Tab switcher for Inspector */
    .tab-nav {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.6);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-btn.active {
      color: var(--accent-blue);
      border-color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.08);
    }

    /* Global Table Node Styling in SVG */
    svg g[id^="table-card-"] {
      cursor: pointer;
      transition: opacity 0.2s ease, filter 0.2s ease;
    }

    svg g[id^="table-card-"]:hover {
      filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.85)) !important;
    }

    .table-selected .card-body-rect,
    .table-selected > rect:first-of-type {
      stroke: #38bdf8 !important;
      stroke-width: 3.5px !important;
    }

    .table-selected {
      filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.95)) !important;
    }

    .table-neighbor .card-body-rect,
    .table-neighbor > rect:first-of-type {
      stroke: #fde047 !important;
      stroke-width: 2.4px !important;
    }

    @keyframes dashFlow {
      to { stroke-dashoffset: -28; }
    }

    .active-conn-path {
      animation: dashFlow 0.9s linear infinite;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand-section">
      <span class="brand-badge">TAS ENGINE</span>
      <div class="brand-title">
        <span>TasDashBoardDev — ERD Explorer</span>
        <span class="brand-sub">117 Tables · 292 Inferred Relational Keys</span>
      </div>
    </div>

    <!-- Controls & Search -->
    <div class="controls-bar">
      <div class="search-box" id="searchBox">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search 117 tables or columns..." autocomplete="off">
        <button type="button" class="search-clear" id="searchClearBtn" title="Clear search">✕</button>
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>

      <div class="domain-filters" id="domainFilters">
        <button type="button" class="filter-btn active" data-domain="ALL">All Tables (117)</button>
        <button type="button" class="filter-btn" data-domain="COMMERCIAL">Commercial (25)</button>
        <button type="button" class="filter-btn" data-domain="OPERATIONS">Operations (17)</button>
        <button type="button" class="filter-btn" data-domain="FLEET_STATIONS">Fleet &amp; Stations (26)</button>
        <button type="button" class="filter-btn" data-domain="FINANCIAL">Financial (6)</button>
        <button type="button" class="filter-btn" data-domain="PLANNING">Planning (11)</button>
        <button type="button" class="filter-btn" data-domain="SYSTEM_ADMIN">System Admin (32)</button>
      </div>

      <button type="button" class="action-btn secondary active" id="btnToggleLines" title="Toggle between showing all 292 inferred lines or only active table lines">🔗 All 292 Lines</button>
      <button type="button" class="action-btn" id="btnResetZoom">⟲ Fit View</button>
      <button type="button" class="action-btn secondary active" id="btnToggleInspector">📋 Inspector</button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="workspace">
    <!-- SVG Canvas -->
    <div class="canvas-container" id="canvasContainer">
      <div id="svgWrapper">
        <svg id="erdSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4626 2460" width="4626" height="2460" style="background:#070b14; display:block;">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#0b1326"/>
    </linearGradient>

    <!-- Domain Glow & Header Gradients -->
    <linearGradient id="hdrFinancial" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="hdrCommercial" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hdrOperations" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hdrFleet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="hdrPlanning" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hdrAdmin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Table Card Background Gradient -->
    <linearGradient id="tableCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Relation Arrow Markers -->
    <marker id="arrowRose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8"/>
    </marker>
    <marker id="circleStart" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3.5" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .banner-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif; font-size: 26px; font-weight: 900; fill: #ffffff; }
    .banner-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif; font-size: 14px; font-weight: 500; fill: #94a3b8; }
    .domain-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.5px; fill: #ffffff; }
    .tbl-title { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 13.5px; font-weight: 800; fill: #ffffff; }
    .tbl-rows { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 700; fill: #e2e8f0; }
    .col-pk { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; font-weight: 800; fill: #fde047; }
    .col-fk { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11.5px; font-weight: 800; fill: #38bdf8; }
    .col-norm { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
    .col-type { font-family: "JetBrains Mono", Consolas, monospace; font-size: 9.5px; font-weight: 600; fill: #64748b; }
    .cardinality-txt { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: 900; fill: #f8fafc; }
  </style>

  <!-- Background Base Canvas -->
  <rect id="bgRect" width="4626" height="2460" fill="url(#bgGradient)"/>

        } else if (fromB.colIdx === 0) {
          side = -1;
        } else if (fromB.colIdx === fromB.totalCols - 1) {
          side = 1;
        } else {
          side = (idx % 2 === 0) ? 1 : -1;
        }
        const xEdge = side > 0 ? (fromB.x + fromB.w) : fromB.x;
        const arc = Math.min(28, Math.max(15, Math.abs(y2 - y1) * 0.08)) + (idx % 3) * 3;
        return `M ${xEdge} ${y1} C ${xEdge + side * arc} ${y1}, ${xEdge + side * arc} ${y2}, ${xEdge} ${y2}`;
      }

      // 3. Cross-column or cross-domain smooth cubic Bezier
      const fromCenterX = fromB.x + fromB.w / 2;
      const toCenterX = toB.x + toB.w / 2;
      const goingRight = toCenterX >= fromCenterX;
      const x1 = goingRight ? (fromB.x + fromB.w) : fromB.x;
      const x2 = goingRight ? toB.x : (toB.x + toB.w);
      const spanX = Math.abs(x2 - x1);
      const bend = Math.max(36, Math.min(340, spanX * 0.38));
      const c1x = x1 + (goingRight ? bend : -bend);
      const c2x = x2 + (goingRight ? -bend : bend);
      const arcY = (spanX > 450 && Math.abs(y2 - y1) < 24) ? (-15 - (idx % 4) * 7) : 0;

      return `M ${x1} ${y1} C ${c1x} ${y1 + arcY}, ${c2x} ${y2 + arcY}, ${x2} ${y2}`;
    }

    function buildFullErdDiagram() {
      const svgNS = 'http://www.w3.org/2000/svg';
      clustersLayer.innerHTML = '';
      relationshipsLayer.innerHTML = '';
      tablesLayer.innerHTML = '';

      const CARD_W = 304;
      const INNER_COL_GAP = 32;
      const ROW_GAP = 22;
      const CLUSTER_PAD_X = 20;
      const CLUSTER_Y = 120;
      const CARDS_START_Y = CLUSTER_Y + 56;
      const CLUSTER_BOTTOM_PAD = 24;
      const CLUSTER_GAP = 28;
      const OUTER_MARGIN_X = 35;
      const MAX_VISIBLE_COLS = 7;

      // Precompute relationship metadata per table
      const fkTargetByColLower = {};
      const refColLowerSet = {};
      const degreeByTable = {};

      Object.keys(DB_DATA.tables).forEach(tname => {
        fkTargetByColLower[tname] = {};
        refColLowerSet[tname] = new Set();
        degreeByTable[tname] = 0;
      });

      DB_DATA.relations.forEach(r => {
        if (degreeByTable[r.from_table] !== undefined) degreeByTable[r.from_table]++;
        if (degreeByTable[r.to_table] !== undefined) degreeByTable[r.to_table]++;

        if (fkTargetByColLower[r.from_table]) {
          (r.from_col || '').split(',').forEach(part => {
            const colLower = part.trim().toLowerCase();
            if (colLower && !fkTargetByColLower[r.from_table][colLower]) {
              fkTargetByColLower[r.from_table][colLower] = r.to_table;
            }
          });
        }
        if (refColLowerSet[r.to_table]) {
          (r.to_col || '').split(',').forEach(part => {
            const colLower = part.trim().toLowerCase();
            if (colLower) refColLowerSet[r.to_table].add(colLower);
          });
        }
      });

      // Group all 117 tables by domain
      const domainTables = {};
      DOMAIN_ORDER.forEach(d => { domainTables[d] = []; });
      Object.keys(DB_DATA.tables).forEach(tname => {
        domainTables[getTableDomain(tname)].push(tname);
      });

      const PRIMARY_HUBS = new Set([
        'AR_Customers', 'AP_Supplierpliers',
        'Com_ContractSetup', 'Com_ContractRule', 'Com_PriceList',
        'Opr_WorkOrder', 'Opr_WorkOrderServices',
        'Opr_Airports', 'Opr_AirCraftModel', 'Opr_AircraftRregistration',
        'Opr_Schedule', 'Opr_PlanHeader',
        'Tas_Company', 'Tas_Currency', 'Tas_Uom'
      ]);
      const SPOTLIGHT_SET = new Set(SPOTLIGHT_TABLES);

      DOMAIN_ORDER.forEach(dom => {
        domainTables[dom].sort((a, b) => {
          const hubDiff = (PRIMARY_HUBS.has(b) ? 1 : 0) - (PRIMARY_HUBS.has(a) ? 1 : 0);
          if (hubDiff !== 0) return hubDiff;
          const degDiff = (degreeByTable[b] || 0) - (degreeByTable[a] || 0);
          if (degDiff !== 0) return degDiff;
          const spotDiff = (SPOTLIGHT_SET.has(b) ? 1 : 0) - (SPOTLIGHT_SET.has(a) ? 1 : 0);
          if (spotDiff !== 0) return spotDiff;
          const rowDiff = (DB_DATA.tables[b].rows || 0) - (DB_DATA.tables[a].rows || 0);
          if (rowDiff !== 0) return rowDiff;
          return a.localeCompare(b);
        });
      });

      const tablesFrag = document.createDocumentFragment();
      let cursorX = OUTER_MARGIN_X;
      let maxClusterBottom = CLUSTER_Y + 600;

      // Place all 117 cards inside their domain masonry columns
      DOMAIN_ORDER.forEach(dom => {
        const meta = DOMAIN_META[dom];
        const tnames = domainTables[dom];
        const numCols = meta.cols;
        const clusterW = CLUSTER_PAD_X * 2 + numCols * CARD_W + (numCols - 1) * INNER_COL_GAP;
        const colHeights = new Array(numCols).fill(CARDS_START_Y);

        tnames.forEach(tname => {
          const tinfo = DB_DATA.tables[tname];
          const allCols = tinfo.columns || [];
          const fkMap = fkTargetByColLower[tname] || {};
          const refSet = refColLowerSet[tname] || new Set();

          // Prioritize PKs -> Outgoing FKs -> Referenced Keys -> Remaining columns
          const picked = [];
          const pickedSet = new Set();
          const pushIfNew = (col) => {
            if (picked.length < MAX_VISIBLE_COLS && !pickedSet.has(col.name)) {
              picked.push(col);
              pickedSet.add(col.name);
            }
          };

          allCols.forEach(c => { if (c.pk) pushIfNew(c); });
          allCols.forEach(c => { if (fkMap[c.name.toLowerCase()]) pushIfNew(c); });
          allCols.forEach(c => { if (refSet.has(c.name.toLowerCase())) pushIfNew(c); });
          allCols.forEach(c => pushIfNew(c));

          const extraCount = Math.max(0, allCols.length - picked.length);
          const cardH = 38 + picked.length * 21 + (extraCount > 0 ? 20 : 8);

          // Shortest sub-column in this domain cluster
          let bestCol = 0;
          for (let c = 1; c < numCols; c++) {
            if (colHeights[c] < colHeights[bestCol]) bestCol = c;
          }

          const cardX = cursorX + CLUSTER_PAD_X + bestCol * (CARD_W + INNER_COL_GAP);
          const cardY = colHeights[bestCol];
          colHeights[bestCol] = cardY + cardH + ROW_GAP;

          const colY = {};
          picked.forEach((col, i) => {
            colY[col.name.toLowerCase()] = cardY + 51 + i * 21 - 4;
          });
          const fallbackY = extraCount > 0
            ? (cardY + cardH - 12)
            : (cardY + 38 + Math.max(12, (picked.length * 21) / 2));

          // Build SVG Card Group (<g id="table-card-...">)
          const g = document.createElementNS(svgNS, 'g');
          g.setAttribute('id', `table-card-${tname}`);
          g.setAttribute('transform', `translate(${cardX}, ${cardY})`);
          g.setAttribute('filter', 'url(#cardShadow)');

          const titleTooltip = document.createElementNS(svgNS, 'title');
          titleTooltip.textContent = `${tname} — ${tinfo.rows.toLocaleString()} rows · ${allCols.length} columns (${meta.label})`;
          g.appendChild(titleTooltip);

          // Card Body
          const bodyRect = document.createElementNS(svgNS, 'rect');
          bodyRect.setAttribute('class', 'card-body-rect');
          bodyRect.setAttribute('width', String(CARD_W));
          bodyRect.setAttribute('height', String(cardH));
          bodyRect.setAttribute('rx', '9');
          bodyRect.setAttribute('fill', 'url(#tableCardBg)');
          bodyRect.setAttribute('stroke', meta.color);
          bodyRect.setAttribute('stroke-width', '1.4');
          g.appendChild(bodyRect);

          // Header Bar (rounded top + flat bottom seam)
          const hdrTop = document.createElementNS(svgNS, 'rect');
          hdrTop.setAttribute('width', String(CARD_W));
          hdrTop.setAttribute('height', '32');
          hdrTop.setAttribute('rx', '9');
          hdrTop.setAttribute('fill', meta.hdrGrad);
          g.appendChild(hdrTop);

          const hdrSeam = document.createElementNS(svgNS, 'rect');
          hdrSeam.setAttribute('y', '24');
          hdrSeam.setAttribute('width', String(CARD_W));
          hdrSeam.setAttribute('height', '8');
          hdrSeam.setAttribute('fill', meta.hdrGrad);
          g.appendChild(hdrSeam);

          // Table Title with adaptive font-size so long names never collide with row pill
          const titleTxt = document.createElementNS(svgNS, 'text');
          titleTxt.setAttribute('x', '10');
          titleTxt.setAttribute('y', '21');
          titleTxt.setAttribute('class', 'tbl-title');
          if (tname.length > 35) {
            titleTxt.style.fontSize = '8.6px';
          } else if (tname.length > 31) {
            titleTxt.style.fontSize = '9.4px';
          } else if (tname.length > 26) {
            titleTxt.style.fontSize = '10.6px';
          } else if (tname.length > 22) {
            titleTxt.style.fontSize = '11.8px';
          }
          titleTxt.textContent = tname;
          g.appendChild(titleTxt);

          // Row Count Pill
          const pillW = 72;
          const pillX = CARD_W - pillW - 8;
          const pillRect = document.createElementNS(svgNS, 'rect');
          pillRect.setAttribute('x', String(pillX));
          pillRect.setAttribute('y', '6');
          pillRect.setAttribute('width', String(pillW));
          pillRect.setAttribute('height', '20');
          pillRect.setAttribute('rx', '4');
          pillRect.setAttribute('fill', 'rgba(15, 23, 42, 0.65)');
          g.appendChild(pillRect);

          const rowsTxt = document.createElementNS(svgNS, 'text');
          rowsTxt.setAttribute('x', String(pillX + pillW / 2));
          rowsTxt.setAttribute('y', '19.5');
          rowsTxt.setAttribute('text-anchor', 'middle');
          rowsTxt.setAttribute('class', 'tbl-rows');
          rowsTxt.textContent = `${tinfo.rows.toLocaleString()} rows`;
          g.appendChild(rowsTxt);

          // Column Rows
          picked.forEach((col, i) => {
            const rowY = 51 + i * 21;
            const fkTarget = fkMap[col.name.toLowerCase()];
            let badgeStr = '';
            if (col.pk && fkTarget) {
              badgeStr = `PK·FK➔${shortenTargetName(fkTarget)}`;
            } else if (col.pk) {
              badgeStr = 'PK';
            } else if (fkTarget) {
              badgeStr = `FK ➔ ${shortenTargetName(fkTarget)}`;
            }

            const badgeWidthPx = badgeStr ? (badgeStr.length * 5.6 + 10) : 0;
            const typeWidthPx = (col.type || '').length * 5.9 + 8;
            const availForColPx = (CARD_W - 18) - badgeWidthPx - typeWidthPx - 18;
            const charW = (col.pk || fkTarget) ? 7.0 : 6.7;
            const maxColChars = Math.max(8, Math.floor(availForColPx / charW));
            const displayColName = col.name.length > maxColChars
              ? (col.name.slice(0, maxColChars - 1) + '…')
              : col.name;

            const colText = document.createElementNS(svgNS, 'text');
            colText.setAttribute('x', '10');
            colText.setAttribute('y', String(rowY));
            colText.setAttribute('class', col.pk ? 'col-pk' : (fkTarget ? 'col-fk' : 'col-norm'));
            const icon = col.pk ? '🔑 ' : (fkTarget ? '🔗 ' : '• ');
            colText.appendChild(document.createTextNode(`${icon}${displayColName} `));

            const typeSpan = document.createElementNS(svgNS, 'tspan');
            typeSpan.setAttribute('class', 'col-type');
            typeSpan.textContent = col.type;
            colText.appendChild(typeSpan);
            g.appendChild(colText);

            if (badgeStr) {
              const badgeTxt = document.createElementNS(svgNS, 'text');
              badgeTxt.setAttribute('x', String(CARD_W - 8));
              badgeTxt.setAttribute('y', String(rowY));
              badgeTxt.setAttribute('text-anchor', 'end');
              badgeTxt.setAttribute('font-size', '9');
              badgeTxt.setAttribute('font-family', "'JetBrains Mono', monospace");
              badgeTxt.setAttribute('fill', meta.color);
              badgeTxt.textContent = badgeStr;
              g.appendChild(badgeTxt);
            }
          });

          // Extra columns footer
          if (extraCount > 0) {
            const moreTxt = document.createElementNS(svgNS, 'text');
            moreTxt.setAttribute('x', '10');
            moreTxt.setAttribute('y', String(cardH - 9));
            moreTxt.setAttribute('font-size', '9.5');
            moreTxt.setAttribute('font-family', 'sans-serif');
            moreTxt.setAttribute('font-style', 'italic');
            moreTxt.setAttribute('fill', '#64748b');
            moreTxt.textContent = `+ ${extraCount} more columns (${allCols.length} total)`;
            g.appendChild(moreTxt);
          }

          tablesFrag.appendChild(g);

          CARD_BOUNDS[tname] = {
            x: cardX,
            y: cardY,
            w: CARD_W,
            h: cardH,
            colIdx: bestCol,
            totalCols: numCols,
            domain: dom,
            colY,
            fallbackY,
            el: g
          };
        });

        const clusterBottom = Math.max(...colHeights) - ROW_GAP + CLUSTER_BOTTOM_PAD;
        const contentH = Math.max(320, clusterBottom - CLUSTER_Y);
        meta.contentBox = { x: cursorX, y: CLUSTER_Y, w: clusterW, h: contentH };
        meta._clusterX = cursorX;
        meta._clusterW = clusterW;
        meta._tableCount = tnames.length;

        if (clusterBottom > maxClusterBottom) {
          maxClusterBottom = clusterBottom;
        }
        cursorX += clusterW + CLUSTER_GAP;
      });

      tablesLayer.appendChild(tablesFrag);

      // Update global SVG dimensions & uniform cluster containers
      const uniformClusterH = maxClusterBottom - CLUSTER_Y;
      SVG_W = cursorX - CLUSTER_GAP + OUTER_MARGIN_X;
      SVG_H = maxClusterBottom + 36;

      erdSvg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
      erdSvg.setAttribute('width', String(SVG_W));
      erdSvg.setAttribute('height', String(SVG_H));
      wrapper.style.width = `${SVG_W}px`;
      wrapper.style.height = `${SVG_H}px`;

      const bgRect = document.getElementById('bgRect');
      const gridRect = document.getElementById('gridRect');
      const bannerBgRect = document.getElementById('bannerBgRect');
      const bannerKpiGroup = document.getElementById('bannerKpiGroup');

      if (bgRect) {
        bgRect.setAttribute('width', String(SVG_W));
        bgRect.setAttribute('height', String(SVG_H));
      }
      if (gridRect) {
        gridRect.setAttribute('width', String(SVG_W));
        gridRect.setAttribute('height', String(SVG_H));
      }
      if (bannerBgRect) {
        bannerBgRect.setAttribute('width', String(SVG_W - OUTER_MARGIN_X * 2));
      }
      if (bannerKpiGroup) {
        const kpiX = Math.max(1380, SVG_W - OUTER_MARGIN_X * 2 - 1086);
        bannerKpiGroup.setAttribute('transform', `translate(${kpiX}, 23)`);
      }

      // Render 6 Domain Cluster Containers
      const clustersFrag = document.createDocumentFragment();
      DOMAIN_ORDER.forEach(dom => {
        const meta = DOMAIN_META[dom];
        meta.box = { x: meta._clusterX, y: CLUSTER_Y, w: meta._clusterW, h: uniformClusterH };

        const cRect = document.createElementNS(svgNS, 'rect');
        cRect.setAttribute('x', String(meta._clusterX));
        cRect.setAttribute('y', String(CLUSTER_Y));
        cRect.setAttribute('width', String(meta._clusterW));
        cRect.setAttribute('height', String(uniformClusterH));
        cRect.setAttribute('rx', '14');
        cRect.setAttribute('fill', meta.bgFill);
        cRect.setAttribute('stroke', meta.borderStroke);
        cRect.setAttribute('stroke-width', '1.2');
        cRect.setAttribute('stroke-dasharray', '6,4');
        clustersFrag.appendChild(cRect);

        const hdrG = document.createElementNS(svgNS, 'g');
        hdrG.setAttribute('transform', `translate(${meta._clusterX + 14}, ${CLUSTER_Y + 12})`);

        const hdrW = meta._clusterW - 28;
        const hdrRect = document.createElementNS(svgNS, 'rect');
        hdrRect.setAttribute('width', String(hdrW));
        hdrRect.setAttribute('height', '28');
        hdrRect.setAttribute('rx', '6');
        hdrRect.setAttribute('fill', meta.hdrGrad);
        hdrG.appendChild(hdrRect);

        const hdrText = document.createElementNS(svgNS, 'text');
        hdrText.setAttribute('x', String(hdrW / 2));
        hdrText.setAttribute('y', '19');
        hdrText.setAttribute('text-anchor', 'middle');
        hdrText.setAttribute('class', 'domain-label');
        if (hdrW < 380) {
          hdrText.style.fontSize = '13px';
        }
        hdrText.textContent = `${meta.headerTitle} (${meta._tableCount} tables)`;
        hdrG.appendChild(hdrText);

        clustersFrag.appendChild(hdrG);
      });
      clustersLayer.appendChild(clustersFrag);

      // Render ALL 292 Inferred Relationship Connection Curves
      const relsFrag = document.createDocumentFragment();
      DB_DATA.relations.forEach((r, idx) => {
        const dStr = computeRelationPath(r, idx);
        if (!dStr) return;

        const fromDom = getTableDomain(r.from_table);
        const toDom = getTableDomain(r.to_table);
        const fromMeta = DOMAIN_META[fromDom];

        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', dStr);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', fromMeta.color);
        path.setAttribute('stroke-width', '1.45');
        path.setAttribute('stroke-opacity', '0.44');
        path.setAttribute('marker-start', 'url(#circleStart)');
        path.setAttribute('marker-end', fromMeta.arrowUrl);
        path.setAttribute('data-from', r.from_table);
        path.setAttribute('data-to', r.to_table);
        path.setAttribute('data-from-domain', fromDom);
        path.setAttribute('data-to-domain', toDom);

        const tip = document.createElementNS(svgNS, 'title');
        tip.textContent = `${r.from_table}.${r.from_col} ➔ ${r.to_table}.${r.to_col} (${r.cardinality})`;
        path.appendChild(tip);

        relsFrag.appendChild(path);
      });
      relationshipsLayer.appendChild(relsFrag);
    }

    // Build all 117 table cards and all 292 connection lines immediately
    buildFullErdDiagram();

    let selectedTable = 'Opr_WorkOrder';
    let currentTab = 'details';
    let activeDomain = 'ALL';
    let activeSearchQuery = '';
    let lastGeneratedSql = '';
    let showAllLines = true;

    let currentScale = 0.32;
    let panX = 24;
    let panY = 20;

    let animTimer = null;
    function updateTransform(smooth = false) {
      if (smooth) {
        wrapper.style.transition = 'transform 0.24s cubic-bezier(0.16, 1, 0.3, 1)';
        clearTimeout(animTimer);
        animTimer = setTimeout(() => { wrapper.style.transition = 'none'; }, 260);
      } else {
        wrapper.style.transition = 'none';
      }
      wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
      if (zoomPctEl) {
        zoomPctEl.textContent = `${Math.round(currentScale * 100)}%`;
      }
    }

    function fitBox(bx, by, bw, bh, padding = 24, maxAutoScale = 1.15) {
      const cw = container.clientWidth || 960;
      const ch = container.clientHeight || 640;
      const scaleX = (cw - padding * 2) / bw;
      const scaleY = (ch - padding * 2) / bh;
      currentScale = Math.min(Math.max(Math.min(scaleX, scaleY), MIN_SCALE), maxAutoScale);
      panX = (cw - bw * currentScale) / 2 - bx * currentScale;
      panY = (ch - bh * currentScale) / 2 - by * currentScale;
      updateTransform(true);
    }

    function resetView() {
      fitBox(0, 0, SVG_W, SVG_H, 18, 1.0);
    }

    function zoomAtPoint(factor, clientX, clientY, smooth = false) {
      const rect = container.getBoundingClientRect();
      const cx = clientX - rect.left;
      const cy = clientY - rect.top;
      const worldX = (cx - panX) / currentScale;
      const worldY = (cy - panY) / currentScale;
      currentScale = Math.min(Math.max(currentScale * factor, MIN_SCALE), MAX_SCALE);
      panX = cx - worldX * currentScale;
      panY = cy - worldY * currentScale;
      updateTransform(smooth);
    }

    function zoomIn() {
      const rect = container.getBoundingClientRect();
      zoomAtPoint(1.25, rect.left + rect.width / 2, rect.top + rect.height / 2, true);
    }

    function zoomOut() {
      const rect = container.getBoundingClientRect();
      zoomAtPoint(1 / 1.25, rect.left + rect.width / 2, rect.top + rect.height / 2, true);
    }

    function focusTableOnCanvas(tname) {
      const b = CARD_BOUNDS[tname];
      if (!b) return;
      const cw = container.clientWidth || 960;
      const ch = container.clientHeight || 640;
      currentScale = Math.min(Math.max(currentScale, 0.88), 1.25);
      panX = cw / 2 - (b.x + b.w / 2) * currentScale;
      panY = ch / 2 - (b.y + b.h / 2) * currentScale;
      updateTransform(true);
    }

    // Smooth Pan & Click Disambiguation
    let isPointerDown = false;
    let dragMoved = 0;
    let downClientX = 0;
    let downClientY = 0;
    let downPanX = 0;
    let downPanY = 0;

    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('.zoom-hud')) return;
      isPointerDown = true;
      dragMoved = 0;
      downClientX = e.clientX;
      downClientY = e.clientY;
      downPanX = panX;
      downPanY = panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - downClientX;
      const dy = e.clientY - downClientY;
      dragMoved = Math.hypot(dx, dy);
      if (dragMoved > 4) {
        container.classList.add('dragging');
        panX = downPanX + dx;
        panY = downPanY + dy;
        updateTransform(false);
      }
    });

    window.addEventListener('mouseup', () => {
      if (!isPointerDown) return;
      isPointerDown = false;
      container.classList.remove('dragging');
    });

    // Canvas click delegation for all 117 SVG table cards
    container.addEventListener('click', (e) => {
      if (e.target.closest('.zoom-hud')) return;
      if (dragMoved > 6) return;
      searchDropdown.classList.remove('open');

      const cardEl = e.target.closest('g[id^="table-card-"]');
      if (cardEl) {
        const tname = cardEl.id.replace('table-card-', '');
        selectTable(tname, false);
      }
    });

    container.addEventListener('dblclick', (e) => {
      if (e.target.closest('.zoom-hud')) return;
      const cardEl = e.target.closest('g[id^="table-card-"]');
      if (cardEl) {
        const tname = cardEl.id.replace('table-card-', '');
        selectTable(tname, true);
      }
    });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : (1 / 1.12);
      zoomAtPoint(factor, e.clientX, e.clientY, false);
    }, { passive: false });

    function toggleInspector(forceOpen) {
      const shouldOpen = typeof forceOpen === 'boolean'
        ? forceOpen
        : inspectorPanel.classList.contains('collapsed');

      inspectorPanel.classList.toggle('collapsed', !shouldOpen);
      btnToggleInspector.classList.toggle('active', shouldOpen);
    }

    function toggleLinesMode() {
      showAllLines = !showAllLines;
      if (btnToggleLines) {
        btnToggleLines.classList.toggle('active', showAllLines);
        btnToggleLines.textContent = showAllLines ? '🔗 All 292 Lines' : '🎯 Active Lines';
      }
      applyCanvasVisibility();
    }

    function drawActiveConnections(tname) {
      if (!activeConnLayer) return;
      activeConnLayer.innerHTML = '';
      if (!CARD_BOUNDS[tname]) return;

      const related = DB_DATA.relations.filter(
        r => r.from_table === tname || r.to_table === tname
      );

      const svgNS = 'http://www.w3.org/2000/svg';
      related.forEach(r => {
        const dStr = computeRelationPath(r, r._idx || 0);
        if (!dStr) return;

        const isSelf = r.from_table === r.to_table;
        const isOutgoing = r.from_table === tname;
        const strokeColor = isSelf ? '#f472b6' : (isOutgoing ? '#38bdf8' : '#34d399');

        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', dStr);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', strokeColor);
        path.setAttribute('stroke-width', '3.1');
        path.setAttribute('stroke-dasharray', '9 5');
        path.setAttribute('class', 'active-conn-path');
        activeConnLayer.appendChild(path);
      });
    }

    function applyCanvasVisibility() {
      const q = activeSearchQuery.toLowerCase().trim();
      const matchedTables = new Set();

      Object.keys(CARD_BOUNDS).forEach(tname => {
        const el = CARD_BOUNDS[tname].el;
        const tinfo = DB_DATA.tables[tname];
        const tdom = getTableDomain(tname);
        const domainMatch = (activeDomain === 'ALL' || tdom === activeDomain);

        let searchMatch = true;
        if (q) {
          const nameHit = tname.toLowerCase().includes(q);
          const colHit = tinfo && tinfo.columns.some(c => c.name.toLowerCase().includes(q));
          searchMatch = nameHit || colHit;
        }

        const isVisible = domainMatch && searchMatch;
        if (isVisible) matchedTables.add(tname);
        el.style.opacity = isVisible ? '1' : '0.12';
      });

      relationshipsLayer.querySelectorAll('path').forEach(p => {
        const fromT = p.getAttribute('data-from');
        const toT = p.getAttribute('data-to');
        const fromDom = p.getAttribute('data-from-domain');
        const toDom = p.getAttribute('data-to-domain');

        if (!showAllLines) {
          const touchesSelected = (fromT === selectedTable || toT === selectedTable);
          p.style.opacity = touchesSelected ? '1' : '0';
          return;
        }

        if (q) {
          p.style.opacity = (matchedTables.has(fromT) || matchedTables.has(toT)) ? '0.9' : '0.05';
        } else if (activeDomain === 'ALL') {
          p.style.opacity = '1';
        } else {
          p.style.opacity = (fromDom === activeDomain || toDom === activeDomain) ? '1' : '0.06';
        }
      });
    }

    function selectTable(tname, shouldFocus = false) {
      const canonical = DB_DATA.tables[tname] ? tname : TABLE_KEY_BY_LOWER[(tname || '').toLowerCase()];
      if (!canonical || !DB_DATA.tables[canonical]) return;
      selectedTable = canonical;

      const neighborSet = new Set();
      DB_DATA.relations.forEach(r => {
        if (r.from_table === canonical) neighborSet.add(r.to_table);
        if (r.to_table === canonical) neighborSet.add(r.from_table);
      });

      Object.keys(CARD_BOUNDS).forEach(idName => {
        const el = CARD_BOUNDS[idName].el;
        el.classList.toggle('table-selected', idName === canonical);
        el.classList.toggle('table-neighbor', idName !== canonical && neighborSet.has(idName));
      });

      drawActiveConnections(canonical);
      if (!showAllLines) {
        applyCanvasVisibility();
      }
      toggleInspector(true);
      if (currentTab === 'catalog') {
        switchInspectorTab('details');
      } else {
        renderInspector();
      }

      if (shouldFocus && CARD_BOUNDS[canonical]) {
        focusTableOnCanvas(canonical);
      }
    }

    function switchInspectorTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      renderInspector();
    }

    function copyFkSql() {
      if (!lastGeneratedSql) return;
      const btn = document.getElementById('btnCopySql');
      navigator.clipboard.writeText(lastGeneratedSql).then(() => {
        if (btn) {
          btn.textContent = '✓ Copied!';
          setTimeout(() => { btn.textContent = '📋 Copy SQL'; }, 1800);
        }
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = lastGeneratedSql;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        if (btn) {
          btn.textContent = '✓ Copied!';
          setTimeout(() => { btn.textContent = '📋 Copy SQL'; }, 1800);
        }
      });
    }

    function renderInspector() {
      const tinfo = DB_DATA.tables[selectedTable];
      if (!tinfo) return;

      const tdom = getTableDomain(selectedTable);
      const domMeta = DOMAIN_META[tdom];
      const onCanvas = Boolean(CARD_BOUNDS[selectedTable]);

      document.getElementById('inspectorTableName').textContent = selectedTable;
      const content = document.getElementById('inspectorContent');

      const outgoing = DB_DATA.relations.filter(r => r.from_table === selectedTable);
      const incoming = DB_DATA.relations.filter(r => r.to_table === selectedTable);

      // Map outgoing column -> target table for quick badge inside column list
      const fkColMap = {};
      outgoing.forEach(r => {
        r.from_col.split(',').map(s => s.trim()).forEach(colName => {
          fkColMap[colName] = r.to_table;
        });
      });

      if (currentTab === 'details') {
        content.innerHTML = `
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;">
            <span style="font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,0.06); color: ${domMeta.color}; border: 1px solid ${domMeta.color}55;">
              ● ${domMeta.label} Domain
            </span>
            ${onCanvas
              ? `<button type="button" class="mini-btn" data-focus-table="${selectedTable}">🎯 Focus on Canvas</button>`
              : `<span style="font-size: 11px; color: #94a3b8;">Auxiliary Table</span>`
            }
          </div>

          <div class="stat-badge-grid">
            <div class="stat-badge">
              <div class="stat-lbl">Row Count</div>
              <div class="stat-val" style="color: #38bdf8;">${tinfo.rows.toLocaleString()}</div>
            </div>
            <div class="stat-badge">
              <div class="stat-lbl">Columns</div>
              <div class="stat-val" style="color: #a855f7;">${tinfo.columns.length}</div>
            </div>
            <div class="stat-badge">
              <div class="stat-lbl">Primary Key(s)</div>
              <div class="stat-val" style="color: #fde047; font-size: 12.5px; word-break: break-word;">${tinfo.pks.join(', ') || 'None (Heap)'}</div>
            </div>
            <div class="stat-badge">
              <div class="stat-lbl">Inferred Links</div>
              <div class="stat-val" style="color: #34d399;">${outgoing.length + incoming.length}</div>
            </div>
          </div>

          <div>
            <div class="section-title">
              <span>🔑 Table Columns (${tinfo.columns.length})</span>
              <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Click 🔗 FK to jump</span>
            </div>
            <div style="max-height: 410px; overflow-y: auto; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px;">
              ${tinfo.columns.map(c => {
                const fkTarget = fkColMap[c.name];
                const lenTxt = c.max_len && c.max_len !== '-1' ? `(${c.max_len})` : (c.max_len === '-1' ? '(MAX)' : '');
                return `
                  <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid rgba(148, 163, 184, 0.08); font-size: 12px; font-family: 'JetBrains Mono', monospace;">
                    <div style="min-width: 0; overflow: hidden; text-overflow: ellipsis;">
                      <span style="color: ${c.pk ? '#fde047' : (fkTarget ? '#38bdf8' : '#f8fafc')}; font-weight: ${c.pk || fkTarget ? '700' : '400'};">
                        ${c.pk ? '🔑 ' : (fkTarget ? '🔗 ' : '• ')}${c.name}
                      </span>
                      ${fkTarget ? `<button type="button" data-jump-table="${fkTarget}" style="margin-left: 6px; background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.35); color: #38bdf8; border-radius: 4px; padding: 1px 5px; font-size: 10px; cursor: pointer; font-family: inherit;">➔ ${fkTarget}</button>` : ''}
                    </div>
                    <span style="color: #94a3b8; font-size: 11px; flex-shrink: 0;">${c.type}${lenTxt}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (currentTab === 'relations') {
        content.innerHTML = `
          <div>
            <div class="section-title">
              <span>📤 Outgoing Foreign Keys (${outgoing.length})</span>
              <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Click to inspect</span>
            </div>
            <div class="rel-list">
              ${outgoing.length ? outgoing.map(r => `
                <button type="button" class="rel-card" data-jump-table="${r.to_table}">
                  <div style="display: flex; justify-content: space-between; width: 100%; font-weight: 700; color: #38bdf8;">
                    <span>🔗 ${r.from_col}</span>
                    <span style="color: #e2e8f0;">➔ ${r.to_table}</span>
                  </div>
                  <div style="color: #94a3b8; font-size: 11.5px;">References: <code>${r.to_table}.${r.to_col}</code> (${r.cardinality})</div>
                </button>
              `).join('') : '<div style="color: #64748b; font-size: 12px;">No outgoing references inferred.</div>'}
            </div>
          </div>

          <div>
            <div class="section-title">
              <span>📥 Incoming References (${incoming.length})</span>
              <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Click to inspect</span>
            </div>
            <div class="rel-list" style="max-height: 310px; overflow-y: auto;">
              ${incoming.length ? incoming.map(r => `
                <button type="button" class="rel-card" data-jump-table="${r.from_table}">
                  <div style="display: flex; justify-content: space-between; width: 100%; font-weight: 700; color: #34d399;">
                    <span>⬅ ${r.from_table}</span>
                    <span style="color: #cbd5e1;">(${r.from_col})</span>
                  </div>
                  <div style="color: #94a3b8; font-size: 11.5px;">Target Key: <code>${r.to_col}</code> (${r.cardinality})</div>
                </button>
              `).join('') : '<div style="color: #64748b; font-size: 12px;">No incoming references inferred.</div>'}
            </div>
          </div>
        `;
      } else if (currentTab === 'sql') {
        lastGeneratedSql = outgoing.map(r => {
          const cleanColSlug = r.from_col.replace(/[^a-zA-Z0-9]/g, '_').replace(/_+/g, '_');
          return [
            `-- Enforce integrity between ${r.from_table} and ${r.to_table}`,
            `ALTER TABLE dbo.[${r.from_table}] WITH NOCHECK`,
            `  ADD CONSTRAINT [FK_${r.from_table}_${r.to_table}_${cleanColSlug}]`,
            `  FOREIGN KEY (${r.from_col.split(',').map(s => '[' + s.trim() + ']').join(', ')})`,
            `  REFERENCES dbo.[${r.to_table}] (${r.to_col.split(',').map(s => '[' + s.trim() + ']').join(', ')});`
          ].join('\n');
        }).join('\n\n');

        content.innerHTML = `
          <div>
            <div class="section-title">
              <span>💻 Recommended SQL DDL (${outgoing.length})</span>
              ${outgoing.length ? `<button type="button" class="mini-btn" id="btnCopySql">📋 Copy SQL</button>` : ''}
            </div>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px; line-height: 1.5;">
              Execute on <code>TasDashBoardDev</code> after orphan cleanup to enforce physical referential integrity constraints.
            </p>
            <div class="code-box">${lastGeneratedSql || '-- No outgoing foreign keys to declare for this table.'}</div>
          </div>
        `;
      } else if (currentTab === 'catalog') {
        const q = activeSearchQuery.toLowerCase().trim();
        const allNames = Object.keys(DB_DATA.tables).sort((a, b) => a.localeCompare(b));
        const filtered = allNames.filter(tname => {
          const domOk = activeDomain === 'ALL' || getTableDomain(tname) === activeDomain;
          if (!domOk) return false;
          if (!q) return true;
          const t = DB_DATA.tables[tname];
          return tname.toLowerCase().includes(q) || t.columns.some(c => c.name.toLowerCase().includes(q));
        });

        content.innerHTML = `
          <div>
            <div class="section-title">
              <span>📚 Database Tables (${filtered.length} / 117)</span>
              <span style="font-size: 11px; color: var(--text-muted);">${activeDomain === 'ALL' ? 'All Domains' : DOMAIN_META[activeDomain].label}</span>
            </div>
            <div class="rel-list" style="max-height: 560px; overflow-y: auto;">
              ${filtered.map(tname => {
                const t = DB_DATA.tables[tname];
                const d = DOMAIN_META[getTableDomain(tname)];
                const isCanvas = Boolean(CARD_BOUNDS[tname]);
                return `
                  <button type="button" class="rel-card" data-jump-table="${tname}" style="${tname === selectedTable ? 'border-color: #38bdf8; background: rgba(56,189,248,0.12);' : ''}">
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: ${d.color};">${tname}</span>
                      <span style="font-size: 10.5px; color: #94a3b8;">${t.rows.toLocaleString()} rows</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; width: 100%; font-size: 11px; color: #64748b;">
                      <span>${t.columns.length} cols · PK: ${t.pks.join(', ') || 'Heap'}</span>
                      <span>${isCanvas ? '🗺️ On Canvas' : '📄 Schema'}</span>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }
    }

    function handleSearch(term) {
      activeSearchQuery = term || '';
      const q = activeSearchQuery.toLowerCase().trim();
      searchClearBtn.style.display = q ? 'block' : 'none';

      applyCanvasVisibility();
      if (currentTab === 'catalog') {
        renderInspector();
      }

      if (!q) {
        searchDropdown.classList.remove('open');
        searchDropdown.innerHTML = '';
        return;
      }

      const matches = [];
      Object.keys(DB_DATA.tables).forEach(tname => {
        const t = DB_DATA.tables[tname];
        const nameHit = tname.toLowerCase().includes(q);
        const matchedCol = !nameHit ? t.columns.find(c => c.name.toLowerCase().includes(q)) : null;
        if (nameHit || matchedCol) {
          matches.push({ tname, rows: t.rows, matchedCol: matchedCol ? matchedCol.name : null, nameHit });
        }
      });

      matches.sort((a, b) => (b.nameHit - a.nameHit) || a.tname.localeCompare(b.tname));
      const topMatches = matches.slice(0, 25);

      if (!topMatches.length) {
        searchDropdown.innerHTML = `<div style="padding: 10px; font-size: 12px; color: #94a3b8;">No tables or columns matching "${q}"</div>`;
      } else {
        searchDropdown.innerHTML = topMatches.map(m => {
          const d = DOMAIN_META[getTableDomain(m.tname)];
          return `
            <div class="search-item" data-jump-table="${m.tname}">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; color: ${d.color};">${m.tname}</span>
                <span style="font-size: 10.5px; color: #94a3b8;">${m.rows.toLocaleString()} rows</span>
              </div>
              <div style="font-size: 11px; color: #64748b;">
                ${d.label}${m.matchedCol ? ` · Matched column: <code style="color:#38bdf8;">${m.matchedCol}</code>` : ''} · 🗺️ Canvas
              </div>
            </div>
          `;
        }).join('');
      }
      searchDropdown.classList.add('open');
    }

    function filterDomain(dom, btnEl) {
      activeDomain = dom;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b === btnEl || b.dataset.domain === dom);
      });

      applyCanvasVisibility();

      if (dom === 'ALL') {
        resetView();
      } else if (DOMAIN_META[dom]) {
        const b = DOMAIN_META[dom].contentBox || DOMAIN_META[dom].box;
        fitBox(b.x, b.y, b.w, b.h, 28, 0.95);
      }

      if (currentTab === 'catalog') {
        renderInspector();
      }
    }

    // Wire up all UI controls via event listeners
    document.getElementById('btnResetZoom').addEventListener('click', resetView);
    document.getElementById('btnToggleInspector').addEventListener('click', () => toggleInspector());
    if (btnToggleLines) {
      btnToggleLines.addEventListener('click', toggleLinesMode);
    }
    document.getElementById('btnCloseInspector').addEventListener('click', () => toggleInspector(false));
    document.getElementById('btnZoomIn').addEventListener('click', zoomIn);
    document.getElementById('btnZoomOut').addEventListener('click', zoomOut);
    document.getElementById('btnFitScreen').addEventListener('click', resetView);

    document.getElementById('domainFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (btn && btn.dataset.domain) {
        filterDomain(btn.dataset.domain, btn);
      }
    });

    document.querySelector('.tab-nav').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (btn && btn.dataset.tab) {
        switchInspectorTab(btn.dataset.tab);
      }
    });

    document.getElementById('inspectorContent').addEventListener('click', (e) => {
      const jumpBtn = e.target.closest('[data-jump-table]');
      if (jumpBtn) {
        const targetTbl = jumpBtn.getAttribute('data-jump-table');
        selectTable(targetTbl, true);
        return;
      }
      const focusBtn = e.target.closest('[data-focus-table]');
      if (focusBtn) {
        focusTableOnCanvas(focusBtn.getAttribute('data-focus-table'));
        return;
      }
      if (e.target.closest('#btnCopySql')) {
        copyFkSql();
      }
    });

    searchInput.addEventListener('input', (e) => handleSearch(e.target.value));
    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim()) {
        searchDropdown.classList.add('open');
      }
    });

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      handleSearch('');
      searchInput.focus();
    });

    searchDropdown.addEventListener('click', (e) => {
      const item = e.target.closest('[data-jump-table]');
      if (item) {
        const targetTbl = item.getAttribute('data-jump-table');
        searchDropdown.classList.remove('open');
        selectTable(targetTbl, true);
      }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchBox')) {
        searchDropdown.classList.remove('open');
      }
    });

    // Expose globals for backwards compatibility
    window.zoomIn = zoomIn;
    window.zoomOut = zoomOut;
    window.resetView = resetView;
    window.toggleInspector = toggleInspector;
    window.toggleLinesMode = toggleLinesMode;
    window.selectTable = selectTable;
    window.switchInspectorTab = switchInspectorTab;
    window.filterDomain = filterDomain;
    window.handleSearch = handleSearch;
    window.copyFkSql = copyFkSql;

    // Initialize view & inspector once layout dimensions are ready
    selectTable('Opr_WorkOrder', false);
    requestAnimationFrame(() => {
      resetView();
    });
  </script>
</body>
</html>
