<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 960" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Cluster Card Gradients -->
    <linearGradient id="carrierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="airportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="aircraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flightTypeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="servicesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="centerHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f265c"/>
      <stop offset="100%" stop-color="#0b1739"/>
    </linearGradient>
    <linearGradient id="outputHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#062e24"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <style>
    .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif; font-size: 23px; font-weight: 800; fill: #ffffff; }
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif; font-size: 13.5px; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .card-meta { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 11px; fill: #94a3b8; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; }
    .item-bullet { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif; font-size: 12px; fill: #cbd5e1; }
    .item-code { font-family: "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #38bdf8; }
    .rel-badge { font-family: "SF Mono", Consolas, monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
    .conn-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif; font-size: 10.5px; font-weight: 600; fill: #94a3b8; }
  </style>

  <!-- Canvas Background -->
  <rect width="1320" height="960" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Ambient Glow Behind Center -->
  <circle cx="660" cy="410" r="260" fill="#1e3a8a" opacity="0.18" filter="url(#glowBlue)"/>

  <!-- ==================== TOP HEADER ==================== -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="1240" height="66" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2"/>
    <rect x="18" y="14" width="8" height="38" rx="4" fill="#38bdf8"/>
    <text x="36" y="32" class="title-main">Ground Handling Contract Setup: Related Factors &amp; Interdependence Architecture</text>
    <text x="36" y="52" class="title-sub">شبكة محددات إنشاء العقود والعلاقات البينية التشغيلية والمالية في منظومة المناولة الأرضية (TAS Engine)</text>
    
    <!-- Legend Badges -->
    <g transform="translate(980, 20)">
      <rect x="0" y="4" width="12" height="12" rx="3" fill="#38bdf8"/>
      <text x="18" y="14" font-size="11" fill="#cbd5e1" font-family="sans-serif">علاقة علائقية (DB)</text>
      
      <rect x="130" y="4" width="12" height="12" rx="3" fill="#34d399"/>
      <text x="148" y="14" font-size="11" fill="#cbd5e1" font-family="sans-serif">شرط تشغيلي (Ops)</text>
    </g>
  </g>

  <!-- ==================== CONNECTING LINES (BEHIND CARDS) ==================== -->
  <g>
    <!-- Factor 1 (Carrier) -> Center Hub -->
    <path d="M 330 220 Q 480 270 530 350" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowCyan)"/>
    
    <!-- Factor 2 (Airport) -> Center Hub -->
    <path d="M 660 250 L 660 330" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowEmerald)"/>
    
    <!-- Factor 3 (Aircraft) -> Center Hub -->
    <path d="M 990 220 Q 840 270 790 350" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowCyan)"/>

    <!-- Factor 4 (Flight Type) -> Center Hub -->
    <path d="M 330 540 Q 480 490 530 450" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <!-- Factor 5 (Services) -> Center Hub -->
    <path d="M 990 540 Q 840 490 790 450" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- Factor 6 (Time Tolerances) -> Center Hub -->
    <path d="M 660 610 L 660 510" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>

    <!-- Center Hub -> Operational Work Order Hub -->
    <path d="M 660 510 L 660 740" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrowEmerald)"/>
  </g>

  <!-- ==================== FACTOR 1: CARRIER & CUSTOMER (Top Left) ==================== -->
  <g transform="translate(50, 125)" filter="url(#cardShadow)">
    <rect width="320" height="190" rx="14" fill="url(#carrierGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="38" rx="14" fill="rgba(99, 102, 241, 0.15)"/>
    <text x="16" y="24" class="card-title">🏢 Carrier &amp; Billing Account</text>
    <rect x="235" y="10" width="70" height="18" rx="9" fill="#4338ca"/>
    <text x="270" y="22" class="badge-txt" fill="#e0e7ff" text-anchor="middle">ENTITY</text>

    <text x="16" y="60" class="item-bullet">• العميل المالي: <tspan class="item-code">AR_Customers</tspan></text>
    <text x="16" y="80" class="item-bullet">• رمز الناقل: <tspan class="item-code">Opr_Airlines (IATA/ICAO)</tspan></text>
    <text x="16" y="100" class="item-bullet">• شروط السداد: <tspan class="item-code">Net-30 / Pre-flight Cash</tspan></text>
    <text x="16" y="120" class="item-bullet">• سقف الائتمان والضمانات البنكية المودعة</text>
    <text x="16" y="140" class="item-bullet">• عملة الفاتورة المعتمدة: <tspan class="item-code">USD / EUR / EGP</tspan></text>

    <!-- Cardinality Pill -->
    <rect x="16" y="156" width="288" height="22" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(129, 140, 248, 0.2)"/>
    <text x="160" y="171" class="conn-label" text-anchor="middle">علاقة علائقية: 1:N (Customer) &amp; N:M (Airlines)</text>
  </g>

  <!-- ==================== FACTOR 2: AIRPORT & STATIONS (Top Center) ==================== -->
  <g transform="translate(500, 115)" filter="url(#cardShadow)">
    <rect width="320" height="185" rx="14" fill="url(#airportGrad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="38" rx="14" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="16" y="24" class="card-title">📍 Airport &amp; Station Scope</text>
    <rect x="235" y="10" width="70" height="18" rx="9" fill="#065f46"/>
    <text x="270" y="22" class="badge-txt" fill="#d1fae5" text-anchor="middle">STATION</text>

    <text x="16" y="60" class="item-bullet">• المحطات المصرح بها: <tspan class="item-code">CAI, HRG, SSH, LXR</tspan></text>
    <text x="16" y="80" class="item-bullet">• جدول الربط: <tspan class="item-code">Com_ContractAirports</tspan></text>
    <text x="16" y="100" class="item-bullet">• بنية المواقف: كباري خرطوم vs مواقف نائية</text>
    <text x="16" y="120" class="item-bullet">• إتاحة معدات المناولة الأرضية بالمحطة</text>
    <text x="16" y="140" class="item-bullet">• رسوم امتياز سلطة الطيران المدني (CAA)</text>

    <rect x="16" y="152" width="288" height="22" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(52, 211, 153, 0.2)"/>
    <text x="160" y="167" class="conn-label" text-anchor="middle">علاقة متعدد لمتعدد: N:M عبر جدول الربط</text>
  </g>

  <!-- ==================== FACTOR 3: AIRCRAFT TYPE & MTOW (Top Right) ==================== -->
  <g transform="translate(950, 125)" filter="url(#cardShadow)">
    <rect width="320" height="190" rx="14" fill="url(#aircraftGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="38" rx="14" fill="rgba(14, 165, 233, 0.15)"/>
    <text x="16" y="24" class="card-title">🛫 Fleet &amp; Aircraft Type</text>
    <rect x="235" y="10" width="70" height="18" rx="9" fill="#0369a1"/>
    <text x="270" y="22" class="badge-txt" fill="#e0f2fe" text-anchor="middle">WEIGHT</text>

    <text x="16" y="60" class="item-bullet">• طراز الطائرة: <tspan class="item-code">Opr_AircraftModels</tspan></text>
    <text x="16" y="80" class="item-bullet">• وزن الإقلاع الأقصى: <tspan class="item-code">MTOW (Tonnage Bands)</tspan></text>
    <text x="16" y="100" class="item-bullet">• تصنيف البدن: <tspan class="item-code">Narrow (C) vs Wide (D/E)</tspan></text>
    <text x="16" y="120" class="item-bullet">• سعة المقاعد والركاب: <tspan class="item-code">Y / C / F Capacity</tspan></text>
    <text x="16" y="140" class="item-bullet">• تسجيل ذيل الطائرة: <tspan class="item-code">Aircraft Registration</tspan></text>

    <rect x="16" y="156" width="288" height="22" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.2)"/>
    <text x="160" y="171" class="conn-label" text-anchor="middle">محدد رئيسي: يحدد شريحة التسعير ووقت المكوث</text>
  </g>

  <!-- ==================== FACTOR 4: FLIGHT TYPE & MISSION (Bottom Left) ==================== -->
  <g transform="translate(50, 480)" filter="url(#cardShadow)">
    <rect width="320" height="190" rx="14" fill="url(#flightTypeGrad)" stroke="rgba(217, 70, 239, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="38" rx="14" fill="rgba(192, 38, 211, 0.15)"/>
    <text x="16" y="24" class="card-title">✈️ Flight Type &amp; Purpose</text>
    <rect x="235" y="10" width="70" height="18" rx="9" fill="#86198f"/>
    <text x="270" y="22" class="badge-txt" fill="#fae8ff" text-anchor="middle">CATEGORY</text>

    <text x="16" y="60" class="item-bullet">• رحلات مجدولة: <tspan class="item-code">Scheduled (Regular Sched.)</tspan></text>
    <text x="16" y="80" class="item-bullet">• رحلات عارضة: <tspan class="item-code">Charter (Ad-hoc / Seasonal)</tspan></text>
    <text x="16" y="100" class="item-bullet">• طيران شحن بضائع: <tspan class="item-code">Cargo / Freighter</tspan></text>
    <text x="16" y="120" class="item-bullet">• هبوط فني للتزود بالوقود: <tspan class="item-code">Technical Stop</tspan></text>
    <text x="16" y="140" class="item-bullet">• طيران خاص رجال أعمال: <tspan class="item-code">VIP / Ambulance</tspan></text>

    <rect x="16" y="156" width="288" height="22" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(217, 70, 239, 0.2)"/>
    <text x="160" y="171" class="conn-label" text-anchor="middle">يحدد إلزامية باقات الخدمات وطريقة التحصيل</text>
  </g>

  <!-- ==================== FACTOR 5: SERVICES & GSE CATALOG (Bottom Right) ==================== -->
  <g transform="translate(950, 480)" filter="url(#cardShadow)">
    <rect width="320" height="190" rx="14" fill="url(#servicesGrad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="38" rx="14" fill="rgba(217, 119, 6, 0.15)"/>
    <text x="16" y="24" class="card-title">🧰 Services Catalog &amp; GSE</text>
    <rect x="235" y="10" width="70" height="18" rx="9" fill="#92400e"/>
    <text x="270" y="22" class="badge-txt" fill="#fef3c7" text-anchor="middle">SGHA 810</text>

    <text x="16" y="60" class="item-bullet">• خدمات المهبط: <tspan class="item-code">Marshalling, Chocks, Push</tspan></text>
    <text x="16" y="80" class="item-bullet">• طاقة وهواء: <tspan class="item-code">GPU (90/140 kVA), ASU</tspan></text>
    <text x="16" y="100" class="item-bullet">• صعود الركاب: سلالم متحركة، حافلات المهبط</text>
    <text x="16" y="120" class="item-bullet">• مرافق المقصورة: مياه نقية، تفريغ الصرف</text>
    <text x="16" y="140" class="item-bullet">• تنسيق الموردين: وقود، تموين، عمولة 5%</text>

    <rect x="16" y="156" width="288" height="22" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(245, 158, 11, 0.2)"/>
    <text x="160" y="171" class="conn-label" text-anchor="middle">علاقة تعاقدية: Com_ContractServices (1:N)</text>
  </g>

  <!-- ==================== FACTOR 6: TIME TOLERANCE & OVERTIME (Bottom Center) ==================== -->
  <g transform="translate(500, 565)" filter="url(#cardShadow)">
    <rect width="320" height="150" rx="14" fill="url(#timeGrad)" stroke="rgba(148, 163, 184, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="34" rx="14" fill="rgba(100, 116, 139, 0.15)"/>
    <text x="14" y="22" class="card-title">⏱️ Ground Time &amp; Overtime</text>
    <rect x="238" y="8" width="70" height="18" rx="9" fill="#334155"/>
    <text x="273" y="20" class="badge-txt" fill="#f1f5f9" text-anchor="middle">TURN-TIME</text>

    <text x="16" y="56" class="item-bullet">• وقت المكوث المشمول مجاناً: <tspan class="item-code">GroundRange</tspan></text>
    <text x="16" y="76" class="item-bullet">• سماحية البدن: ضيق (60 دقيقة) vs عريض (120 دقيقة)</text>
    <text x="16" y="96" class="item-bullet">• احتساب الوقت الإضافي: شرائح كل نصف ساعة</text>
    <text x="16" y="116" class="item-bullet">• غرامات التأخير وتجاوز وقت المهبط المصرح</text>

    <rect x="16" y="124" width="288" height="18" rx="5" fill="rgba(15, 23, 42, 0.8)"/>
    <text x="160" y="137" class="conn-label" text-anchor="middle">ساعة الفوترة: تبدأ مع وضع الأوتاد وتنتهي بالسحب</text>
  </g>

  <!-- ==================== CENTRAL HUB: CONTRACT MASTER (The Core) ==================== -->
  <g transform="translate(470, 315)" filter="url(#cardShadow)">
    <rect width="380" height="225" rx="18" fill="url(#centerHubGrad)" stroke="#38bdf8" stroke-width="2.5"/>
    
    <rect x="0" y="0" width="380" height="42" rx="18" fill="rgba(56, 189, 248, 0.25)"/>
    <text x="190" y="27" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">📄 Com_Contracts (رأس العقد الرئيسي)</text>

    <g transform="translate(20, 52)">
      <text x="0" y="16" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8">PK: ContractID</text>
      <text x="180" y="16" font-family="monospace" font-size="12" fill="#cbd5e1">VersionNumber (v1, v2...)</text>

      <text x="0" y="38" font-family="monospace" font-size="11.5" fill="#f8fafc">ContractNumber: <tspan fill="#34d399">GH-2026-MS-001</tspan></text>
      <text x="0" y="60" font-family="monospace" font-size="11.5" fill="#f8fafc">EffectiveFrom: <tspan fill="#cbd5e1">2026-01-01</tspan> | ValidTo: <tspan fill="#f43f5e">2026-12-31</tspan></text>
      <text x="0" y="82" font-family="monospace" font-size="11.5" fill="#f8fafc">Currency: <tspan fill="#fbbf24">USD</tspan> | PaymentTermID: <tspan fill="#cbd5e1">Net-30 Days</tspan></text>
      <text x="0" y="104" font-family="monospace" font-size="11.5" fill="#f8fafc">PricingModel: <tspan fill="#38bdf8">MTOW Tonnage Tier + Margin Shield</tspan></text>
    </g>

    <rect x="18" y="180" width="344" height="28" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)"/>
    <text x="190" y="198" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">نقطة الربط المركزية بين السياسات التجارية والتشغيل الميداني</text>
  </g>

  <!-- ==================== BOTTOM HUB: THE CONVERGENCE POINT (Work Order & Billing) ==================== -->
  <g transform="translate(180, 745)" filter="url(#cardShadow)">
    <rect width="960" height="175" rx="16" fill="url(#outputHubGrad)" stroke="#34d399" stroke-width="2"/>
    <rect x="0" y="0" width="960" height="38" rx="16" fill="rgba(16, 185, 129, 0.25)"/>
    <text x="30" y="24" font-family="sans-serif" font-size="15" font-weight="800" fill="#ffffff">🎯 نقطة الالتقاء والتشغيل الفعلي: أمر تشغيل المهبط والفوترة الآلية (Opr_WorkOrder &amp; Billing)</text>
    <rect x="830" y="10" width="105" height="20" rx="10" fill="#047857"/>
    <text x="882" y="23" class="badge-txt" fill="#ecfdf5" text-anchor="middle">REAL-TIME OPS</text>

    <!-- Sub Process Columns -->
    <g transform="translate(30, 52)">
      <!-- Col 1 -->
      <rect x="0" y="0" width="280" height="105" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(52, 211, 153, 0.3)"/>
      <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">1. التحقق الآلي للرحلة (Matching)</text>
      <text x="15" y="46" class="item-bullet">• مطابقة المطار: هل <tspan class="item-code">CAI</tspan> ضمن العقد؟</text>
      <text x="15" y="66" class="item-bullet">• فحص صلاحية التاريخ: <tspan class="item-code">FlightDate IN Window</tspan></text>
      <text x="15" y="86" class="item-bullet">• فحص شروط الائتمان وسداد الـ Proforma</text>

      <!-- Col 2 -->
      <rect x="310" y="0" width="280" height="105" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(52, 211, 153, 0.3)"/>
      <text x="325" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">2. ضبط سقف المهبط (Work Order)</text>
      <text x="325" y="46" class="item-bullet">• تعيين المعدات المصرح بها لطراز الطائرة</text>
      <text x="325" y="66" class="item-bullet">• تحديد ساعات الطاقة المجانية (<tspan class="item-code">Free GPU 120m</tspan>)</text>
      <text x="325" y="86" class="item-bullet">• توجيه مقاولي الوقود والتموين المعتمدين</text>

      <!-- Col 3 -->
      <rect x="620" y="0" width="280" height="105" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(52, 211, 153, 0.3)"/>
      <text x="635" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#fbbf24">3. الفاتورة والمطابقة الثلاثية (Billing)</text>
