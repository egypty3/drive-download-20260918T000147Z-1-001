<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tahoma", sans-serif; font-size: 24px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tahoma", sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tahoma", sans-serif; font-size: 17px; font-weight: 700; fill: #f8fafc; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tahoma", sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tahoma", sans-serif; font-size: 13.5px; fill: #cbd5e1; }
    .item-bullet { font-size: 14px; }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="920" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="30" y="24" width="900" height="70" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
  <text x="480" y="52" text-anchor="middle" class="title">دورة حياة العقود في نظام إدارة المناولة والفوترة (TAS)</text>
  <text x="480" y="76" text-anchor="middle" class="subtitle">End-to-End Ground Handling Contract Lifecycle &amp; Turnaround Billing Engine</text>

  <!-- ==================== CARD 1 ==================== -->
  <g transform="translate(40, 115)" filter="url(#shadow)">
    <rect width="880" height="120" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Stage Badge -->
    <rect x="730" y="16" width="130" height="28" rx="6" fill="url(#blueGlow)"/>
    <text x="795" y="35" text-anchor="middle" class="badge-text">المرحلة 01</text>
    <!-- Card Title -->
    <text x="715" y="36" text-anchor="end" class="card-title">التأسيس والحوكمة التجارية (Master Setup &amp; Governance)</text>
    <!-- Bullets -->
    <text x="850" y="68" text-anchor="end" class="item-text"><tspan fill="#38bdf8">●</tspan> تعريف الناقل الجوي، العملة المعتمدة، والتسهيلات الائتمانية (14 أو 30 يوماً أو دفع نقدي مسبق).</text>
    <text x="850" y="93" text-anchor="end" class="item-text"><tspan fill="#38bdf8">●</tspan> تحديد المطارات والمحطات، طرازات وأوزان الطائرات (MTOW)، وفهرس خدمات أياتا (IATA SGHA).</text>
  </g>

  <!-- Connecting Arrow 1 -> 2 -->
  <path d="M 480 235 L 480 265" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrowBlue)"/>

  <!-- ==================== CARD 2 ==================== -->
  <g transform="translate(40, 275)" filter="url(#shadow)">
    <rect width="880" height="120" rx="14" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.8"/>
    <!-- Stage Badge -->
    <rect x="730" y="16" width="130" height="28" rx="6" fill="url(#indigoGlow)"/>
    <text x="795" y="35" text-anchor="middle" class="badge-text">المرحلة 02</text>
    <!-- Card Title -->
    <text x="715" y="36" text-anchor="end" class="card-title">المسار التجاري وتجهيز الرحلة (Pre-Flight Commercial)</text>
    <!-- Bullets -->
    <text x="850" y="68" text-anchor="end" class="item-text"><tspan fill="#818cf8">●</tspan> استقبال طلب الرحلة واحتساب التعرفة آلياً عبر محرك التسعير (Dynamic Rate Engine).</text>
    <text x="850" y="93" text-anchor="end" class="item-text"><tspan fill="#818cf8">●</tspan> إصدار عرض السعر (Quotation)، الفاتورة المبدئية (Proforma)، وتوليد أمر العمل (Work Order).</text>
  </g>

  <!-- Connecting Arrow 2 -> 3 -->
  <path d="M 480 395 L 480 425" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- ==================== CARD 3 ==================== -->
  <g transform="translate(40, 435)" filter="url(#shadow)">
    <rect width="880" height="120" rx="14" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.8"/>
    <!-- Stage Badge -->
    <rect x="730" y="16" width="130" height="28" rx="6" fill="url(#amberGlow)"/>
    <text x="795" y="35" text-anchor="middle" class="badge-text">المرحلة 03</text>
    <!-- Card Title -->
    <text x="715" y="36" text-anchor="end" class="card-title">التنفيذ الميداني على أرض المهبط (Apron Operations)</text>
    <!-- Bullets -->
    <text x="850" y="68" text-anchor="end" class="item-text"><tspan fill="#f59e0b">●</tspan> هبوط الطائرة ووضع الأوتاد (Chocks-On) لبدء عداد وقت المكوث وساعات الكهرباء الأرضية (GPU).</text>
    <text x="850" y="93" text-anchor="end" class="item-text"><tspan fill="#f59e0b">●</tspan> تقديم السلالم، المياه، الصرف، الوقود، وإتمام التوقيع الإلكتروني الفوري لكابتن الطائرة.</text>
  </g>

  <!-- Connecting Arrow 3 -> 4 -->
  <path d="M 480 555 L 480 585" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- ==================== CARD 4 ==================== -->
  <g transform="translate(40, 595)" filter="url(#shadow)">
    <rect width="880" height="120" rx="14" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.8"/>
    <!-- Stage Badge -->
    <rect x="730" y="16" width="130" height="28" rx="6" fill="url(#emeraldGlow)"/>
    <text x="795" y="35" text-anchor="middle" class="badge-text">المرحلة 04</text>
    <!-- Card Title -->
    <text x="715" y="36" text-anchor="end" class="card-title">المطابقة الثلاثية والفوترة النهائية (3-Way Match &amp; Invoicing)</text>
    <!-- Bullets -->
    <text x="850" y="68" text-anchor="end" class="item-text"><tspan fill="#10b981">●</tspan> المطابقة الثلاثية الذكية: تفويض الشراء + سجل المهبط + فاتورة مقاول الباطن لحماية الهامش الربحي.</text>
    <text x="850" y="93" text-anchor="end" class="item-text"><tspan fill="#10b981">●</tspan> احتساب غرامات المكوث الإضافي والرسوم، وإصدار الفاتورة الضريبية وترحيلها لـ (AR).</text>
  </g>

  <!-- Connecting Arrow 4 -> 5 -->
  <path d="M 480 715 L 480 745" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- ==================== CARD 5 ==================== -->
  <g transform="translate(40, 755)" filter="url(#shadow)">
    <rect width="880" height="120" rx="14" fill="url(#cardGrad1)" stroke="#f43f5e" stroke-width="1.8"/>
    <!-- Stage Badge -->
    <rect x="730" y="16" width="130" height="28" rx="6" fill="url(#roseGlow)"/>
    <text x="795" y="35" text-anchor="middle" class="badge-text">المرحلة 05</text>
    <!-- Card Title -->
    <text x="715" y="36" text-anchor="end" class="card-title">الرقابة، خصومات الحجم، وتجديد العقد (Audit &amp; Renewal)</text>
    <!-- Bullets -->
    <text x="850" y="68" text-anchor="end" class="item-text"><tspan fill="#f43f5e">●</tspan> تطبيق خصومات الحجم التراكمية (Volume Rebates) عند بلوغ عدد معين من الرحلات الشهرية.</text>
    <text x="850" y="93" text-anchor="end" class="item-text"><tspan fill="#f43f5e">●</tspan> تنبيهات استباقية قبل انتهاء العقد بـ (90/60/30 يوماً) لدراسة وتجديد الأسعار بإصدار جديد.</text>
  </g>
</svg>
